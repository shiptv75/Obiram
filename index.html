<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Obiram TV — লাইভ বাংলা টিভি</title>
<meta name="description" content="বাংলাদেশ ও ভারতের সব লাইভ টিভি চ্যানেল, খেলা, খবর ও সিনেমা এক জায়গায়।">
<meta name="theme-color" content="#0a0510">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash" class="splash">
  <div class="splash-mark">
    <span class="pulse-ring r1"></span>
    <span class="pulse-ring r2"></span>
    <span class="pulse-ring r3"></span>
    <span class="splash-logo">O</span>
  </div>
  <div class="splash-word">OBIRAM <span>TV</span></div>
  <div class="splash-sub">চ্যানেল লিস্ট লোড হচ্ছে…</div>
  <div class="splash-bar"><div class="splash-bar-fill" id="splashFill"></div></div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app" class="app hidden">

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="menuToggle" class="icon-btn only-mobile" aria-label="মেনু">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">O</span>
        <span class="brand-word">OBIRAM<span>TV</span></span>
      </div>
    </div>

    <div class="topbar-search">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-3.8-3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="চ্যানেল খুঁজুন…" autocomplete="off">
      <button id="searchClear" class="search-clear hidden" aria-label="মুছুন">✕</button>
    </div>

    <div class="topbar-right">
      <div class="live-clock" id="liveClock">--:--</div>
    </div>
  </header>

  <div class="body-wrap">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <nav class="cat-list" id="catList">
        <!-- filled by JS -->
      </nav>
      <div class="sidebar-foot">
        <a href="https://t.me/" target="_blank" rel="noopener" class="tg-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21.9 3.4 2.6 11c-.9.35-.9 1.65.1 1.95l4.9 1.5 1.9 6c.25.75 1.2.95 1.75.35l2.65-2.9 5 3.7c.75.55 1.85.15 2.05-.75l3.4-15.6c.25-1.1-.85-2-1.85-1.85Z"/></svg>
          <span>টেলিগ্রাম সাপোর্ট</span>
        </a>
      </div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

    <!-- Main -->
    <main class="main">

      <!-- Continue watching -->
      <section id="resumeSection" class="row hidden">
        <h2 class="row-title">যেখানে ছিলেন</h2>
        <div class="row-scroll" id="resumeRow"></div>
      </section>

      <!-- Favorites -->
      <section id="favSection" class="row hidden">
        <h2 class="row-title">প্রিয় চ্যানেল</h2>
        <div class="row-scroll" id="favRow"></div>
      </section>

      <!-- Grid by category -->
      <div id="catSections"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-mark">📡</div>
        <p>কোনো চ্যানেল পাওয়া যায়নি</p>
        <span>অন্য নামে খুঁজে দেখুন</span>
      </div>
    </main>
  </div>
</div>

<!-- ===== PLAYER OVERLAY ===== -->
<div id="playerOverlay" class="player-overlay hidden">
  <div class="player-shell">
    <div class="player-topbar">
      <div class="player-info">
        <img id="playerLogo" class="player-logo" src="" alt="">
        <div>
          <div class="player-name" id="playerName">চ্যানেল</div>
          <div class="player-group" id="playerGroup"><span class="live-dot"></span>LIVE</div>
        </div>
      </div>
      <div class="player-actions">
        <button id="favBtn" class="icon-btn" aria-label="প্রিয়">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 21s-7.5-4.6-10.2-9.2C.3 8.7 1.8 5 5.4 4.3c2-.4 3.9.5 5 2.2l1.6 2.4 1.6-2.4c1.1-1.7 3-2.6 5-2.2 3.6.7 5.1 4.4 3.6 7.5C19.5 16.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="shareBtn" class="icon-btn" aria-label="শেয়ার">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 8a3 3 0 1 0-2.8-4.1L8.9 7.5a3 3 0 1 0 0 5l6.3 3.6a3 3 0 1 0 .9-1.7L9.8 11a3 3 0 0 0 0-2l6.3-3.6c.5.4 1.2.6 1.9.6z" fill="currentColor"/></svg>
        </button>
        <button id="closePlayer" class="icon-btn" aria-label="বন্ধ করুন">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="video-wrap" id="videoWrap">
      <video id="videoEl" playsinline></video>
      <div id="videoLoading" class="video-loading hidden">
        <span class="pulse-ring r1"></span><span class="pulse-ring r2"></span>
        <span class="mini-mark">O</span>
      </div>
      <div id="videoError" class="video-error hidden">
        <p>এই সার্ভার থেকে চালু করা যাচ্ছে না</p>
        <button id="retryBtn" class="btn-solid">পরের সার্ভার চেষ্টা করুন</button>
      </div>
    </div>

    <div class="player-controls">
      <div class="ctrl-left">
        <button id="ppBtn" class="ctrl-btn" aria-label="প্লে/পজ">
          <svg id="ppIcon" viewBox="0 0 24 24" width="20" height="20"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
        </button>
        <button id="muteBtn" class="ctrl-btn" aria-label="মিউট">
          <svg id="muteIcon" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>
        </button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1" class="volume-slider">
      </div>
      <div class="ctrl-right">
        <div class="server-select-wrap">
          <select id="serverSelect" class="ctrl-select"></select>
        </div>
        <select id="aspectSelect" class="ctrl-select">
          <option value="contain">ফিট</option>
          <option value="cover">পূর্ণ স্ক্রিন</option>
          <option value="fill">স্ট্রেচ</option>
        </select>
        <button id="pipBtn" class="ctrl-btn" aria-label="পিকচার ইন পিকচার">
          <svg viewBox="0 0 24 24" width="19" height="19"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="fsBtn" class="ctrl-btn" aria-label="ফুলস্ক্রিন">
          <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
